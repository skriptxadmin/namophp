{extends file='layouts/base.html'}


{block name="content"}

<div class="container">
  <div class="row justify-content-center align-items-center mt-5">
    <div class="col-12 col-sm-10 col-md-6 col-lg-5">

      <form class="card login">

        <div class="card-body p-4 p-md-5">

          <div class="text-center">
            <div class="login-icon mb-3">
              {svg file="user"}
            </div>
            <h2 class="h3 fw-bold mb-2">Welcome back</h2>
            <p class="text-secondary mb-0">
              Sign in to continue to your account.
            </p>
          </div>

          <div class="my-2">
            <a href="{$url}/guest/register" class="d-flex align-items-start justify-content-end"
              aria-label="Create Account"> Create Account
            </a>

          </div>

          <div class="form-group mb-3">
            <label for="username" class="form-label fw-medium">
              Mobile
            </label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username"
              autocomplete="username" value="">
          </div>

          <div class="form-group mb-3">
            <label for="password" class="form-label fw-medium">
              Password
            </label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" name="password"
                placeholder="Enter your password" autocomplete="current-password" required>
              <button class="btn btn-outline-secondary password-toggler" type="button" aria-label="Show password">
                {svg file="password"}
              </button>
            </div>
          </div>

          <div class="text-end mb-4">
            <a href="{$url}/guest/forgot-password" class="login-link text-decoration-none">
              Forgot password?
            </a>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">
            Sign in
          </button>

          <p class="text-center text-secondary small mt-4 mb-0">
            Secure access to your account
          </p>

        </div>
      </form>

    </div>
  </div>
</div>
{/block}

{block name="scripts"}
{js file="scripts/guest/login.js"}
{/block}
